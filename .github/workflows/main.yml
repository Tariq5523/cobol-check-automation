name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Zowe CLI
        run: |
          npm install -g @zowe/cli
          zowe --version

      - name: Trust mainframe CA certificate (optional)
        env:
          ZOWE_CA_CERT: ${{ secrets.ZOWE_CA_CERT }}
        run: |
          if [ -n "$ZOWE_CA_CERT" ]; then
            printf '%s\n' "$ZOWE_CA_CERT" > "$RUNNER_TEMP/zowe-ca.pem"
            echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/zowe-ca.pem" >> "$GITHUB_ENV"
            echo "Custom CA certificate configured"
          else
            echo "No custom CA certificate provided; using default trust store"
          fi

      - name: Setup Mainframe Environment and Upload COBOL Check
        env:
          ZOWE_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          .github/scripts/zowe_operations.sh

      - name: Run COBOL Check on Mainframe
        env:
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_SSH_PORT: ${{ secrets.ZOWE_SSH_PORT }}
        run: |
          set -e

          UPPER_USER=$(echo "$ZOWE_USERNAME" | tr '[:lower:]' '[:upper:]')
          LOWER_USER=$(echo "$ZOWE_USERNAME" | tr '[:upper:]' '[:lower:]')
          USS_DIR="/z/$LOWER_USER/cobolcheck"
      
          zowe zos-uss issue ssh \
            "bash $USS_DIR/mainframe_operations.sh $UPPER_USER" \
            --port "${ZOWE_SSH_PORT:-22}" \
            --insecure
